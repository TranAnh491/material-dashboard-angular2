<div class="account-page">
  <button type="button" class="account-back" (click)="backToMenu()">← Menu</button>
  <h1>Quản lý tài khoản</h1>
  <p class="account-id" *ngIf="employeeId || email">{{ employeeId || email }}</p>

  <section class="account-card">
    <h2>Đổi tên</h2>
    <label>
      Họ tên
      <input type="text" [(ngModel)]="displayName" autocomplete="name" />
    </label>
    <button type="button" (click)="saveName()" [disabled]="savingName">
      {{ savingName ? 'Đang lưu…' : 'Lưu tên' }}
    </button>
  </section>

  <section class="account-card">
    <h2>Đổi mật khẩu</h2>
    <p class="account-hint">Mật khẩu mới từ 4 ký tự trở lên.</p>
    <label>
      Mật khẩu hiện tại
      <input type="password" [(ngModel)]="currentPassword" autocomplete="current-password" />
    </label>
    <label>
      Mật khẩu mới
      <input type="password" [(ngModel)]="newPassword" autocomplete="new-password" />
    </label>
    <label>
      Nhập lại mật khẩu mới
      <input type="password" [(ngModel)]="confirmPassword" autocomplete="new-password" />
    </label>
    <button type="button" (click)="savePassword()" [disabled]="savingPassword">
      {{ savingPassword ? 'Đang lưu…' : 'Đổi mật khẩu' }}
    </button>
  </section>
</div>

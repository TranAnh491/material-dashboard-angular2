<div class="fgtem-gate-screen" *ngIf="!plant.plant">
  <div class="fgtem-gate-screen__title">Tem Thành Phẩm</div>
  <div class="fgtem-gate">
    <button type="button" (click)="plant.choose('ASM1')">
      <strong>ASM1 / ASM3</strong>
      <span>KZLSX</span>
    </button>
    <button type="button" (click)="plant.choose('ASM2')">
      <strong>ASM2</strong>
      <span>LHLSX</span>
    </button>
  </div>
</div>

<div class="fgtem-shell" *ngIf="plant.plant">
  <aside class="fgtem-nav">
    <div class="fgtem-nav__brand">Tem Thành Phẩm</div>
    <a routerLink="/tem-thanh-pham"
       routerLinkActive="is-on"
       [routerLinkActiveOptions]="{ exact: true }">
      <i class="material-icons">sell</i>
      AXONE & FJXR
    </a>
    <a routerLink="/tem-thanh-pham/lich-su" routerLinkActive="is-on">
      <i class="material-icons">history</i>
      Lịch sử in
    </a>
    <div class="fgtem-nav__foot">
      <button type="button" class="fgtem-nav__back" (click)="plant.clear()">Đổi nhà máy</button>
      <label class="fgtem-nav__import">
        <i class="material-icons">upload_file</i>
        Import danh mục
        <span class="fgtem-nav__days" *ngIf="importDays !== null">{{ importDays }}</span>
        <input type="file" accept=".xlsx,.xls" (change)="pickCatalog($event)">
      </label>
    </div>
  </aside>
  <section class="fgtem-main">
    <router-outlet></router-outlet>
  </section>
</div>

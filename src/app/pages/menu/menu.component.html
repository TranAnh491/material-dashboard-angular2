<div class="mn">
  <!-- Thanh đầu trang -->
  <header class="mn-top">
    <div class="mn-brand">
      <img src="assets/img/logo.png" alt="Airspeed" class="mn-brand__logo">
      <div class="mn-brand__text">
        <b>Airspeed Warehouse</b>
        <span>Hệ thống quản lý kho</span>
      </div>
    </div>
    <label class="mn-search">
      <i class="material-icons">search</i>
      <input
        type="text"
        placeholder="Tìm tab hoặc mã NVL…"
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchTermChange($event)"
        (keydown.enter)="openGlobalSearch()"
        title="Gõ tên tab để lọc · gõ mã NVL rồi Enter để tra tồn (Ctrl+K ở mọi trang)"
      />
      <kbd>Ctrl K</kbd>
    </label>
    <button type="button" class="mn-lang" title="Ngôn ngữ / Language" (click)="toggleLang()">{{ lang === 'vi' ? 'VI' : 'EN' }}</button>
  </header>

  <main class="mn-body">
    <div class="mn-hero">
      <h1>Menu</h1>
      <p>Chọn chức năng để bắt đầu</p>
    </div>

    <!-- Dùng gần đây -->
    <section class="mn-section" *ngIf="recentTabs.length">
      <h2 class="mn-section__title"><i class="material-icons">history</i>Dùng gần đây</h2>
      <div class="mn-recent">
        <button type="button" *ngFor="let tab of recentTabs; trackBy: trackByPath" class="mn-chip tone-{{ tab.tone }}" (click)="navigateToTab(tab.path)">
          <i class="material-icons">{{ tab.icon }}</i>{{ tab.title }}
        </button>
      </div>
    </section>

    <!-- Các nhóm -->
    <ng-container *ngFor="let cat of categories">
      <section class="mn-section" *ngIf="filteredByCategory[cat.key]?.length">
        <h2 class="mn-section__title">{{ cat.label }}</h2>
        <div class="mn-grid">
          <button type="button"
                  *ngFor="let tab of filteredByCategory[cat.key]; trackBy: trackByPath"
                  class="mn-card tone-{{ tab.tone }}"
                  (click)="navigateToTab(tab.path)">
            <span class="mn-card__icon"><i class="material-icons">{{ tab.icon }}</i></span>
            <span class="mn-card__text">
              <span class="mn-card__title">{{ tab.title }}</span>
              <span class="mn-card__sub">{{ getMenuCardSubtitle(tab) }}</span>
            </span>
            <i class="material-icons mn-card__go">chevron_right</i>
          </button>
        </div>
      </section>
    </ng-container>

    <p class="mn-empty" *ngIf="searchTerm && !hasAnyResult()">Không có tab khớp “{{ searchTerm }}” — Enter để tra theo mã NVL.</p>

    <footer class="mn-foot">
      <button type="button" class="mn-logout" (click)="logout()" title="Đăng xuất">
        <i class="material-icons">logout</i>
        <span>Đăng xuất</span>
      </button>
    </footer>
  </main>
</div>
